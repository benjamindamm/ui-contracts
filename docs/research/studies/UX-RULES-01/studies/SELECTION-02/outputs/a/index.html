<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Persönliche Angaben</title><link rel="stylesheet" href="styles.css"><script src="form.js" defer></script><body><main><h1>Persönliche Angaben</h1><p>Alle Felder sind Pflichtfelder. Ihre Angaben werden nur lokal geprüft.</p><form id="personal-form" novalidate><div data-component="Input"><label data-part="label" for="givenName-control">Vorname</label><input data-part="control" id="givenName-control" name="givenName" type="text" autocomplete="given-name" required><p data-part="error" id="givenName-error" hidden></p></div>
<div data-component="Input"><label data-part="label" for="familyName-control">Nachname</label><input data-part="control" id="familyName-control" name="familyName" type="text" autocomplete="family-name" required><p data-part="error" id="familyName-error" hidden></p></div>
<div data-component="Input"><label data-part="label" for="email-control">E-Mail</label><input data-part="control" id="email-control" name="email" type="email" autocomplete="email" required><p data-part="error" id="email-error" hidden></p></div>
<div data-component="Input"><label data-part="label" for="nationalNumber-control">Rufnummer</label><input data-part="control" id="nationalNumber-control" name="nationalNumber" type="tel" autocomplete="tel-national" required><p data-part="error" id="nationalNumber-error" hidden></p></div>
<div data-component="Select"><label data-part="label" for="country-control">Ländervorwahl</label><select data-part="control" id="country-control" name="countryKey" required aria-describedby="country-hint"><option value="">Bitte wählen</option><option value="CH">Schweiz (+41)</option><option value="DE">Deutschland (+49)</option><option value="FR">Frankreich (+33)</option></select><p data-part="hint" id="country-hint">Wählen Sie das Land Ihrer Rufnummer.</p><p data-part="error" id="country-error" hidden></p></div><button type="submit">Angaben prüfen</button><p id="submission-status" role="status" aria-live="polite"></p></form></main></body></html>
