<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persönliche Angaben</title><link rel="stylesheet" href="styles.css"><script src="form.js" defer></script></head><body><main><h1>Persönliche Angaben</h1><p>Alle Felder sind erforderlich. Ihre Angaben werden nur lokal geprüft.</p><form id="personal-form" novalidate><div data-component="Input"><label data-part="label" for="person-givenName">Vorname</label><input data-part="control" id="person-givenName" name="givenName" type="text" autocomplete="given-name" required><p data-part="error" id="givenName-error" hidden></p></div><div data-component="Input"><label data-part="label" for="person-familyName">Nachname</label><input data-part="control" id="person-familyName" name="familyName" type="text" autocomplete="family-name" required><p data-part="error" id="familyName-error" hidden></p></div><div data-component="Input"><label data-part="label" for="person-email">E-Mail</label><input data-part="control" id="person-email" name="email" type="email" autocomplete="email" required><p data-part="error" id="email-error" hidden></p></div><div data-component="Input"><label data-part="label" for="person-nationalNumber">Rufnummer</label><input data-part="control" id="person-nationalNumber" name="nationalNumber" type="tel" autocomplete="tel-national" required><p data-part="error" id="nationalNumber-error" hidden></p></div><div data-component="SelectWithSearch" id="country-control"><span id="country-label" data-part="label">Ländervorwahl</span><button type="button" id="country-trigger" data-part="trigger" aria-labelledby="country-label country-value" aria-haspopup="dialog" aria-expanded="false" aria-controls="country-picker" aria-describedby="country-hint"><span id="country-value">Bitte wählen</span> ▾</button><p id="country-hint" data-part="hint">Land oder Vorwahl in der Suche eingeben.</p><div id="country-picker" role="dialog" aria-labelledby="country-label" data-part="dialog" hidden><label for="country-search">Länder durchsuchen</label><input id="country-search" data-part="search" type="search" autocomplete="off" aria-controls="country-options"><ul id="country-options" role="listbox" aria-labelledby="country-label" data-part="listbox"></ul><p id="country-empty" role="status" hidden>Keine Länder gefunden.</p><button type="button" id="country-close">Schließen</button></div><input type="hidden" id="country-key" name="countryKey" value=""><p id="country-error" data-part="error" hidden></p></div><button type="submit" class="submit">Angaben lokal prüfen</button><p id="form-result" role="status" aria-live="polite"></p></form><noscript>Bitte JavaScript aktivieren, um die lokale Auswahl und Prüfung zu verwenden.</noscript></main></body></html>
