<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persönliche Angaben</title><link rel="stylesheet" href="styles.css"><script defer src="form.js"></script><main><h1>Persönliche Angaben</h1><p>Wählen Sie das Land Ihrer Rufnummer. Ihre Angaben bleiben auf diesem Gerät.</p><form id="personal-form"><div data-component="Input"><label data-part="label" for="givenName">Vorname</label><input data-part="control" id="givenName" name="givenName" type="text" autocomplete="given-name"></div><div data-component="Input"><label data-part="label" for="familyName">Nachname</label><input data-part="control" id="familyName" name="familyName" type="text" autocomplete="family-name"></div><div data-component="Input"><label data-part="label" for="email">E-Mail</label><input data-part="control" id="email" name="email" type="email" autocomplete="email"></div><div data-component="Input"><label data-part="label" for="nationalNumber">Rufnummer</label><input data-part="control" id="nationalNumber" name="nationalNumber" type="tel" autocomplete="tel-national"></div><div data-component="Autocomplete" data-state="closed" id="country-component"><label data-part="label" id="country-label" for="country-query">Land und Vorwahl</label><div class="anchor"><input id="country-query" data-part="input" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="country-list" aria-describedby="country-hint country-status" placeholder="Land oder Vorwahl suchen …" autocomplete="off" required><div data-component="Overlay" data-part="surface" id="country-popup" hidden><div data-component="ScrollArea" data-part="viewport"><ul data-part="list" role="listbox" id="country-list" aria-labelledby="country-label"></ul></div></div></div><div id="country-status" data-part="status" role="status" aria-live="polite" aria-atomic="true"></div><p id="country-hint">Tippen zum Filtern. Mit Pfeiltasten navigieren und mit Enter auswählen.</p><input type="hidden" id="country-value" name="country"></div><button type="submit">Angaben prüfen</button><p id="form-status" role="status" aria-live="polite"></p></form><noscript>Bitte JavaScript aktivieren, um ein Land auszuwählen.</noscript></main></html>
